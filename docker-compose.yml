services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - VECTOR_BACKEND=${VECTOR_BACKEND:-qdrant}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_LOCAL_PATH=
      - CHROMA_URL=http://chroma:8000
      - CHROMA_LOCAL_PATH=
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-local}
    volumes:
      - app_data:/app/data
    depends_on:
      - qdrant
      - chroma
    restart: unless-stopped

  # Qdrant is the default backend; set VECTOR_BACKEND=chroma to use Chroma instead.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  app_data:
  qdrant_data:
  chroma_data:
